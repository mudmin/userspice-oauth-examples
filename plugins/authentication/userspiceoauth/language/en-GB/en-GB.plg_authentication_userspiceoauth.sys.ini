PLG_AUTHENTICATION_USERSPICEOAUTH="Authentication - UserSpice OAuth"
PLG_AUTHENTICATION_USERSPICEOAUTH_XML_DESCRIPTION="Allows users to log in to Joomla using their UserSpice account via OAuth2. After enabling, ensure you configure the Client ID, Client Secret, and UserSpice Server URL. You will also need to add a link or button to your login form that directs users to 'index.php?userspiceoauth=1' to initiate the UserSpice login."

PLG_AUTHENTICATION_USERSPICEOAUTH_CONFIG_LABEL="UserSpice OAuth Settings"

PLG_AUTHENTICATION_USERSPICEOAUTH_SERVER_URL_LABEL="UserSpice Server URL"
PLG_AUTHENTICATION_USERSPICEOAUTH_SERVER_URL_DESC="The base URL of your UserSpice installation (e.g., https://example.com/userspice/). Ensure it ends with a slash if UserSpice is in a subdirectory that requires it for its paths."
PLG_AUTHENTICATION_USERSPICEOAUTH_CLIENT_ID_LABEL="Client ID"
PLG_AUTHENTICATION_USERSPICEOAUTH_CLIENT_ID_DESC="The Client ID obtained from your UserSpice OAuth Server plugin configuration."
PLG_AUTHENTICATION_USERSPICEOAUTH_CLIENT_SECRET_LABEL="Client Secret"
PLG_AUTHENTICATION_USERSPICEOAUTH_CLIENT_SECRET_DESC="The Client Secret obtained from your UserSpice OAuth Server plugin configuration."

PLG_AUTHENTICATION_USERSPICEOAUTH_AUTH_ENDPOINT_PATH_LABEL="Authorization Endpoint Path"
PLG_AUTHENTICATION_USERSPICEOAUTH_AUTH_ENDPOINT_PATH_DESC="Path to the UserSpice authorization endpoint, relative to the UserSpice Server URL (e.g., usersc/plugins/oauth_server/auth.php)."
PLG_AUTHENTICATION_USERSPICEOAUTH_TOKEN_ENDPOINT_PATH_LABEL="Token Endpoint Path"
PLG_AUTHENTICATION_USERSPICEOAUTH_TOKEN_ENDPOINT_PATH_DESC="Path to the UserSpice token endpoint, relative to the UserSpice Server URL (e.g., usersc/plugins/oauth_server/auth.php). This is often the same as the authorization endpoint in UserSpice."
PLG_AUTHENTICATION_USERSPICEOAUTH_USERINFO_ENDPOINT_PATH_LABEL="User Info Endpoint Path"
PLG_AUTHENTICATION_USERSPICEOAUTH_USERINFO_ENDPOINT_PATH_DESC="Path to the UserSpice user information API endpoint, relative to the UserSpice Server URL (e.g., usersc/plugins/oauth_server/api.php)."

PLG_AUTHENTICATION_USERSPICEOAUTH_SCOPE_LABEL="Scope"
PLG_AUTHENTICATION_USERSPICEOAUTH_SCOPE_DESC="Space-separated list of scopes to request from UserSpice (e.g., 'profile email' or just 'profile'). 'email' is recommended for linking accounts."

PLG_AUTHENTICATION_USERSPICEOAUTH_CREATE_USER_LABEL="Auto-create Joomla User"
PLG_AUTHENTICATION_USERSPICEOAUTH_CREATE_USER_DESC="If enabled, a new Joomla user account will be automatically created if one does not already exist for the authenticated UserSpice user's email address."
PLG_AUTHENTICATION_USERSPICEOAUTH_DEFAULT_GROUP_LABEL="Default Joomla User Group"
PLG_AUTHENTICATION_USERSPICEOAUTH_DEFAULT_GROUP_DESC="Select the Joomla user group to which newly created users will be assigned. 'Registered' is typical."

PLG_AUTHENTICATION_USERSPICEOAUTH_BUTTON_TEXT_LABEL="Login Button Text (Informational)"
PLG_AUTHENTICATION_USERSPICEOAUTH_BUTTON_TEXT_DESC="Text suggestion for a 'Login with UserSpice' button/link. Note: This plugin does not automatically add a button to your login form. You'll need to add a link/button manually to your template or via a custom HTML module, pointing to 'index.php?userspiceoauth=1' (or a SEF equivalent)."

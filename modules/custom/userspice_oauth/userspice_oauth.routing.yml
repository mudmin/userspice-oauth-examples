userspice_oauth.callback:
  path: '/userspice_oauth/callback'
  defaults:
    _controller: '\Drupal\userspice_oauth\Controller\UserSpiceOAuthController::callback'
    _title: 'UserSpice OAuth Callback'
  requirements:
    _access: 'TRUE' # Accessible by anonymous users to complete login

userspice_oauth.redirect:
  path: '/userspice_oauth/redirect'
  defaults:
    _controller: '\Drupal\userspice_oauth\Controller\UserSpiceOAuthController::redirectToUserSpice'
    _title: 'Redirecting to UserSpice'
  requirements:
    _access: 'TRUE' # Accessible by anonymous users to initiate login

userspice_oauth.settings_form:
  path: '/admin/config/userspice_oauth/settings'
  defaults:
    _form: '\Drupal\userspice_oauth\Form\SettingsForm'
    _title: 'UserSpice OAuth Settings'
  requirements:
    _permission: 'administer site configuration'

userspice_oauth.login_link: # This might not be used directly but good for reference
  path: '/user/login/userspice' # A more user-friendly path to initiate login
  defaults:
    _controller: '\Drupal\userspice_oauth\Controller\UserSpiceOAuthController::redirectToUserSpice'
  requirements:
    _access: 'TRUE'
